<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粵語 SFA 訓練原型</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: patient area on top (picture + one clear task), therapist judging bar docked at the bottom. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#13241F; --ink-2:#4A5C56; --line:#CBD6D1;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#DAEEE8;
  --cue:#9A5A00; --cue-soft:#FBEBD0;
  --good:#1B7448; --good-soft:#DCF1E5; --bad:#AE372B; --bad-soft:#F8E1DD;
  --pend:#5E3FB0; --pend-soft:#E9E2F8; --na:#66736E; --na-soft:#E4E9E7;
  --judge-bg:#172722; --judge-ink:#EAF2EF; --judge-line:#35493F; --pic:#FFFFFF;
  --font-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --font-body:"Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --scale:1; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1715; --surface:#18231F; --surface-2:#1F2C28; --ink:#E8F0ED; --ink-2:#A9B8B3; --line:#33443E;
    --accent:#4FC3AE; --accent-ink:#06211C; --accent-soft:#173A33;
    --cue:#F0B354; --cue-soft:#3B2C12;
    --good:#5FD093; --good-soft:#163526; --bad:#F08A7D; --bad-soft:#3F1D19;
    --pend:#B6A0F2; --pend-soft:#2A2145; --na:#8A9893; --na-soft:#26312D;
    --judge-bg:#090F0D; --judge-ink:#E8F0ED; --judge-line:#2C3B35; --pic:#F4F6F5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1715; --surface:#18231F; --surface-2:#1F2C28; --ink:#E8F0ED; --ink-2:#A9B8B3; --line:#33443E;
  --accent:#4FC3AE; --accent-ink:#06211C; --accent-soft:#173A33;
  --cue:#F0B354; --cue-soft:#3B2C12;
  --good:#5FD093; --good-soft:#163526; --bad:#F08A7D; --bad-soft:#3F1D19;
  --pend:#B6A0F2; --pend-soft:#2A2145; --na:#8A9893; --na-soft:#26312D;
  --judge-bg:#090F0D; --judge-ink:#E8F0ED; --judge-line:#2C3B35; --pic:#F4F6F5;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}

/* buttons */
.btn{min-height:56px;padding:0 22px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 14px;font-size:.92rem;font-weight:500}

.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1.5px solid transparent}
.p-good{background:var(--good-soft);color:var(--good)}
.p-cue{background:var(--cue-soft);color:var(--cue)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-pend{background:var(--pend-soft);color:var(--pend);border-color:var(--pend);border-style:dashed}
.p-na{background:var(--na-soft);color:var(--na)}
.p-todo{background:transparent;color:var(--ink-2);border-color:var(--line)}

/* home */
.home{padding:28px 0 48px;display:grid;gap:26px}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.08em;color:var(--cue)}
.home h1{font-family:var(--font-display);font-size:2.5rem;line-height:1.2;margin-top:4px}
.lede{color:var(--ink-2);font-size:1.05rem;max-width:40em;margin-top:6px}
.notice{border:2px dashed var(--cue);background:var(--cue-soft);color:var(--ink);border-radius:var(--r);padding:14px 18px;font-size:.98rem}
.notice b{color:var(--cue)}
.sec-h{font-size:1.1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h small{font-weight:400;color:var(--ink-2);font-size:.9rem}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.item{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.item[aria-pressed="false"]{opacity:.6}
.item .thumb{width:100%;max-width:120px;background:var(--pic);border-radius:10px}
.item .w{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.item .j{font-size:.8rem;color:var(--ink-2)}
.item .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.9rem;font-weight:700;color:transparent}
.item[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.home-actions{display:flex;gap:12px;flex-wrap:wrap}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;counter-reset:st}
.flow li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;counter-increment:st}
.flow li::before{content:counter(st);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-bottom:6px}
.flow h3{font-size:1rem}
.flow p{font-size:.9rem;color:var(--ink-2)}
ol.flow{margin:0;padding:0}

/* session top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.count{font-size:.9rem;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;flex:1;min-width:300px;margin:0;padding:0;align-items:stretch}
/* 其他階段：細字、變淡；目前階段：實色、放大、加外框，一眼見到 */
.steps li{list-style:none;flex:1;height:3.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;font-size:.82rem;font-weight:700;line-height:1.2;padding:0 6px;border-radius:14px;background:transparent;color:var(--ink-2);border:1.5px solid var(--line);white-space:nowrap;opacity:.55;transition:opacity .2s}
.steps li .sx{font-size:.72rem;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.steps li .sx svg{width:12px;height:12px}
.steps li.past{color:var(--accent);border-color:var(--accent-soft)}
.steps li.on{flex:1.45;opacity:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.08rem;box-shadow:0 0 0 4px var(--accent-soft),0 4px 12px rgba(14,107,91,.25)}
.steps li.on .sx{font-size:.78rem}
.steps li.on .lv{opacity:.7}
.steps li.on .lv.cur{opacity:1;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.steps li.off{border-style:dashed;color:var(--na);background:repeating-linear-gradient(135deg,var(--na-soft) 0 6px,transparent 6px 12px);opacity:.6}
.top-actions{display:flex;gap:8px;margin-left:auto}

/* stage */
.stage{flex:1;padding:18px 0 22px}
.stage .wrap{display:grid;gap:16px}
.flash{border-radius:var(--r);padding:12px 18px;font-size:1.15rem;font-weight:700}
.flash.good{background:var(--good-soft);color:var(--good)}
.flash.info{background:var(--accent-soft);color:var(--ink)}
.duo{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px;align-items:stretch}
.pic{background:var(--pic);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;place-items:center}
.pic svg{width:100%;height:auto;max-width:330px;display:block}
.pic img,.thumb img{width:100%;height:auto;display:block;aspect-ratio:1/1;object-fit:contain}
.pic img{max-width:330px}
.nopic{display:grid;place-items:center;width:100%;aspect-ratio:1/1;font-family:var(--font-display);font-size:2.2rem;font-weight:700;color:var(--ink-2)}
.pic .nopic{max-width:330px;font-size:4rem}
/* 自訂詞語 */
.wordsHead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.wordsHead .sec-h{margin:0}
.addword{display:flex;gap:8px;flex:1;min-width:260px;max-width:440px;margin:0}
.addword input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:max(16px,1.05rem);padding:0 14px}
.addword input::placeholder{color:var(--ink-2);opacity:.55}
.addword input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.addword .btn{min-height:52px}
.addmsg{flex-basis:100%;margin:0;font-size:.9rem;color:var(--ink-2)}
.addmsg.ok{color:var(--good);font-weight:700}
.addmsg.err{color:var(--bad);font-weight:700}
.itemwrap{display:grid;gap:6px;align-content:start}
.itemwrap .item{width:100%}
.badge{position:absolute;top:8px;left:8px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--cue-soft);color:var(--cue);border:1px solid var(--cue);z-index:1}
.badge.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.editbtn{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem;font-weight:700;padding:0 10px}
div.item{cursor:default}
.item.loading{border-style:dashed}
.item.loading .thumb{display:grid;place-items:center;aspect-ratio:1/1}
.item.loading .j{font-size:.78rem}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.item.failed{border-color:var(--bad);border-style:dashed;align-content:start}
.gerr{font-size:.82rem;color:var(--bad)}
.genacts{display:grid;gap:6px;width:100%}
.savebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;flex-basis:100%}
.savestat{font-size:.88rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.savestat.ok{color:var(--good);font-weight:700}
.savestat.warn{color:var(--cue);font-weight:700}
.savestat.err{color:var(--bad);font-weight:700}
.storenote{border:2px dashed var(--cue);background:var(--cue-soft);border-radius:var(--r);padding:10px 16px;font-size:.92rem;margin:0}
.resume{padding:48px 0 64px;display:grid;gap:22px;max-width:760px}
.resume h1{font-family:var(--font-display);font-size:2.6rem;line-height:1.2}
.resume .lede b{color:var(--ink);font-variant-numeric:tabular-nums}
.rwords{display:flex;flex-wrap:wrap;gap:8px}
.rwords span{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:1.15rem;font-weight:700}
.rwords span.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.rwords span.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.resume-acts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.resume-acts .btn{min-height:96px;font-size:1.45rem;border-radius:20px}
@media (max-width:560px){.resume-acts{grid-template-columns:1fr}}
.warnbox{border:2px solid var(--cue);background:var(--cue-soft);border-radius:var(--r);padding:14px 18px;display:grid;gap:10px}
.warnbox .home-actions{gap:10px}
/* 詞語編輯 */
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-weight:700;font-size:.92rem}
.fld input[type=text]{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:max(16px,1rem);padding:0 12px;width:100%}
.fld input[type=text]:disabled{opacity:.45}
.fld input[type=text]::placeholder{color:var(--ink-2);opacity:.55}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feated{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.feated .fh2{display:flex;justify-content:space-between;align-items:center}
.nachk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;min-height:44px}
.nachk input{width:22px;height:22px}
.edpic{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.edpic .thumb{width:130px;flex:none;background:var(--pic);border-radius:12px;border:1px solid var(--line);padding:6px}
.ederr{color:var(--bad);font-weight:700;background:var(--bad-soft);border-radius:10px;padding:10px 14px;margin:0}
.drawer h3{font-size:1.05rem;margin-top:6px}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;align-content:start}
/* 固定行高：每一步嘅問題框高度一樣，撳判讀掣時畫面唔會跳 */
.tagrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:2.2rem;flex-wrap:wrap}
.fb{border-radius:999px;padding:4px 14px;font-size:1rem;font-weight:700}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.info{background:var(--accent-soft);color:var(--ink)}
.qrow{min-height:44px}
.slotA{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.slotB{min-height:5rem;display:grid;align-content:center}
.duo{align-items:start} /* 圖片唔跟問題框拉高，唔會重新置中而郁動 */
.duo .slotB{min-height:7.5rem}
.duo .slotA{min-height:6rem}
.duo .tagrow{min-height:4.4rem;align-items:flex-start;align-content:flex-start} /* 窄框預留兩行俾回饋字句 */
.slotB .answer{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:10px 18px}
.slotB .answer .big{font-size:2.6rem}
.slotB .locked{min-height:76px}
.slotB .chips{flex-wrap:wrap}
.tag{font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.q{font-family:var(--font-display);font-size:2.1rem;font-weight:700;line-height:1.25}
.hint{color:var(--ink-2);font-size:1.05rem}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.replay{flex:none;min-height:52px;font-weight:700;color:var(--accent);border-color:var(--accent)}
.replay svg{width:24px;height:24px}
.speak{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;color:var(--accent)}
.speak svg{width:34px;height:34px;flex:none}
.locked{border:2px dashed var(--line);border-radius:var(--r);padding:16px 18px;color:var(--ink-2);display:flex;gap:12px;align-items:center;background:var(--surface-2)}
.locked svg{width:26px;height:26px;flex:none}
.opts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
.opt{min-height:76px;padding:8px 12px;border-radius:var(--r);border:2.5px solid var(--accent);background:var(--surface);font-family:var(--font-display);font-size:1.55rem;font-weight:700;line-height:1.2}
.opt:active{background:var(--accent-soft)}
.opts.done .opt{cursor:default;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:background-color .25s,opacity .25s}
.opt.is-correct{background:var(--good);border-color:var(--good);color:#fff}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.is-dim{opacity:.4}
.opt .mk{font-family:var(--font-body);font-size:1.3rem}
.nextq{min-height:68px;font-size:1.3rem;padding:0 32px}
.revealrow{min-height:68px}
.revealhead{font-size:1.25rem;font-weight:700;color:var(--ink)}
.revealrow .hint{font-size:1.25rem;font-weight:700;color:var(--ink)}
.rbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.big{font-family:var(--font-display);font-size:3.2rem;font-weight:700;line-height:1.15}
.jy{font-size:1rem;color:var(--ink-2);font-family:var(--font-body);font-weight:400;letter-spacing:.02em}
.answer{background:var(--cue-soft);border-radius:var(--r);padding:16px 20px;display:grid;gap:4px}
.answer .lab{font-size:.9rem;font-weight:700;color:var(--cue)}
.answer.good{background:var(--good-soft)}
.answer.good .lab{color:var(--good)}
.vtoggle svg{width:22px;height:22px;flex:none}
.vtoggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.vtoggle[aria-pressed="false"]{border-style:dashed;color:var(--ink-2)}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{min-width:84px;min-height:72px;padding:6px 16px;border-radius:var(--r);background:var(--accent-soft);border:2px solid var(--accent);font-family:var(--font-display);font-size:2rem;font-weight:700;display:grid;place-items:center}
.chip.blank{background:var(--surface-2);border-style:dashed;color:var(--ink-2)}
.plus{font-size:1.6rem;color:var(--ink-2);font-weight:700}
.ptimer{position:absolute;left:22px;right:22px;bottom:5px;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.ptimer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px}

/* SFA chart */
.chart{display:grid;grid-template-columns:1fr minmax(170px,250px) 1fr;gap:12px;align-items:stretch}
.chart .col{display:grid;gap:12px}
.feat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 14px;min-height:70px;display:grid;gap:4px;align-content:start}
.feat .fh{display:flex;justify-content:space-between;align-items:center;gap:8px;height:1.7rem}
.feat .fl{font-weight:700;font-size:.95rem;color:var(--ink-2)}
.feat .fa{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.2}
.feat .fa.empty{color:var(--line)}
.feat.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.feat.now .fl{color:var(--accent)}
.feat.s-na{background:repeating-linear-gradient(135deg,var(--na-soft) 0 10px,var(--surface) 10px 20px);border-style:dashed}
.feat.s-na .fa{color:var(--na);font-size:1.05rem;font-family:var(--font-body)}
.feat.s-pending{border-color:var(--pend);border-style:dashed}
.chart .pic{padding:8px}
.chart .pic svg,.chart .pic img,.chart .pic .nopic{max-width:190px}
.chart+.panel{padding:16px 22px;gap:10px}
.chart+.panel .q{font-size:1.8rem}

/* judge bar */
.judge{position:sticky;bottom:0;background:var(--judge-bg);color:var(--judge-ink);border-top:3px dashed var(--judge-line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.judge .wrap{display:grid;gap:10px}
.jrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.jlabel{font-size:.78rem;font-weight:700;letter-spacing:.06em;padding:3px 10px;border:1.5px dashed var(--judge-ink);border-radius:999px;white-space:nowrap}
.jtarget{font-size:.95rem;flex:1;min-width:200px}
.jtarget b{font-size:1.1rem}
.timer{display:flex;align-items:center;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbar{width:120px;height:10px;border-radius:99px;background:var(--judge-line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:#F0B354}
.jbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.jtype input::placeholder{color:#9AA8A3;opacity:1}
.jtype input:focus{outline:3px solid #F0B354;outline-offset:1px}
.jtype button{border-radius:12px;border:0;background:#F0B354;color:#172722;font-weight:700;padding:0 14px;white-space:nowrap}
.jsm.pendbtn{border-style:dashed;border-color:#B6A0F2;color:#D9CCFA;display:inline-flex;align-items:center}
.pendlist{display:grid;gap:10px}
.pendlist .rv{flex-direction:column;align-items:stretch}
.pendlist .acts{display:flex;gap:8px;flex-wrap:wrap}
.pendlist .acts .btn{flex:1}
.typed{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:8px;background:var(--cue-soft);color:var(--ink);font-size:.9rem}
.jb{min-height:56px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:1rem;padding:4px 8px;line-height:1.2}
.jb.c{background:#2E9B63;color:#fff}
.jb.x{background:#C4493B;color:#fff}
.jb.n{background:#5B6A65;color:#fff}
.jb.p{background:transparent;border:2px dashed #B6A0F2;color:#D9CCFA}
.jb.w{background:#EAF2EF;color:#172722}
.jb:disabled{opacity:.35;cursor:not-allowed}
.jsub{display:flex;gap:8px;flex-wrap:wrap}
.jsm{min-height:44px;padding:0 14px;border-radius:10px;background:transparent;border:1.5px solid var(--judge-line);color:var(--judge-ink);font-size:.9rem}
.jsm:disabled{opacity:.35}
.jnote{font-size:.88rem;opacity:.85}

/* done + summary */
.donecard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:grid;gap:4px;justify-items:start}
.kv span.k{font-size:.82rem;color:var(--ink-2);font-weight:700}
.sum{padding:26px 0 48px;display:grid;gap:22px}
.sum h1{font-family:var(--font-display);font-size:2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .n{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:.88rem;color:var(--ink-2)}
.tile.pend{border:2px dashed var(--pend)}
.tile.pend .n{color:var(--pend)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:.9rem}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
td:first-child,th:first-child{text-align:left;padding-left:14px}
td .w{font-family:var(--font-display);font-size:1.2rem;font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.review{display:grid;gap:10px}
.rv{background:var(--surface);border:2px dashed var(--pend);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rv .t{flex:1;min-width:200px}
.rv .t small{display:block;color:var(--ink-2)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);align-items:center}
textarea.copy{width:100%;min-height:180px;font:inherit;font-size:.9rem;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* settings drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.55);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;overscroll-behavior:contain;padding-bottom:45vh!important;background:var(--surface);overflow-y:auto;padding:22px 22px 40px;display:grid;gap:18px;align-content:start}
.drawer h2{font-family:var(--font-display);font-size:1.6rem}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.row .rl{font-weight:700}
.row .rd{font-size:.88rem;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:1.6rem;font-weight:700}
.stepper output{min-width:96px;text-align:center;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:68px;height:40px;border-radius:99px;border:2px solid var(--line);background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(28px);background:var(--accent-ink)}

@media (max-width:760px){

function featStatus(f){if(f.na)return'na';if(f.oral==='pending')return'pending';if(f.oral==='correct')return'oral';if(f.option==='correct')return'option';if(f.option)return'model';return'todo';}
const FPILL={oral:['good','口語正確'],option:['cue','選項正確'],model:['bad','示範'],na:['na','不適用'],pending:['pend','待覆核'],todo:['todo','未做']};
function nameFinal(n){
  for(const a of n.attempts){if(a.r==='correct')return a.stage==='oral'?'ind':a.stage==='cue'?'cue':'rep';}
  if(n.attempts.some(a=>a.r==='pending'))return'pending';
  if(n.attempts.some(a=>a.stage==='model'))return'fail';
  return n.attempts.length?'prog':'todo';
}

function extFinal(e){if(e.oral==='correct')return'ind';if(e.oral==='pending'||e.rep==='pending')return'pending';if(e.rep==='correct')return'rep';if(e.rep)return'fail';if(e.oral)return'prog';return'todo';}
const EPILL={ind:['good','獨立'],rep:['cue','跟讀'],fail:['bad','未能'],pending:['pend','待覆核'],prog:['todo','進行中'],todo:['todo','未做']};

const extxt=(R,i)=>(R.extMax!=null&&i>R.extMax)?'未開放':R.extSkipped?'未進行':EPILL[extFinal(R.ext[i])][1];

function pendings(){
  const out=[];
  state.records.forEach((r,ri)=>{const it=ITEMS[r.item];
    const ty=(w,i)=>(r.typed||{})[w+':'+i]||'';
    if(r.name1==='pending')out.push({ri,w:'name1',i:0,word:it.word,label:'初次命名',target:it.word,typed:ty('name1',0)});
    r.feats.forEach((f,i)=>{if(f.oral==='pending')out.push({ri,w:'feat',i,word:it.word,label:'特徵 · '+FEATS[i].label+'（口語回答）',target:it.feats[FEATS[i].key].a,typed:ty('feat',i)});});
    r.name2.attempts.forEach((a,i)=>{if(a.r==='pending')out.push({ri,w:'name2',i,word:it.word,label:'再次命名 · '+({oral:'無提示',cue:'首音提示後',model:'示範後跟讀'})[a.stage],target:it.word,typed:ty('name2',i)});});
    r.ext.forEach((e,i)=>{if(e.oral==='pending')out.push({ri,w:'extO',i,word:it.word,label:'延伸 · '+LEVELS[i],target:it.ext[i].parts.join(''),typed:ty('extO',i)});if(e.rep==='pending')out.push({ri,w:'extR',i,word:it.word,label:'延伸 · '+LEVELS[i]+'（跟讀）',target:it.ext[i].parts.join(''),typed:ty('extR',i)});});

}

/* ---------- 訓練進度 ---------- */
function progressSnapshot(){
  return{v:1,at:Date.now(),queue:state.queue.map(i=>ITEMS[i].id),qi:state.qi,
    records:state.records.map(r=>Object.assign(JSON.parse(JSON.stringify(r)),{item:ITEMS[r.item].id}))};
}
let progBusy=false,progAgain=false;
function saveProgress(){
  if(!state.records.length)return'none';
  if(state.records.every(r=>r.done))return clearProgress();
  try{localStorage.setItem(PROG_KEY,JSON.stringify(progressSnapshot()));return'local';}catch(e){return'error';}
}
function clearProgress(){
  try{localStorage.removeItem(PROG_KEY);return'cleared';}catch(e){return'error';}
}
function restoreProgress(p){
  const pairs=p.queue.map((id,k)=>({i:ITEMS.findIndex(it=>it.id===id),r:p.records[k]})).filter(x=>x.i>=0&&x.r);
  if(!pairs.length)return false;
  state.queue=pairs.map(x=>x.i);
  state.records=pairs.map(x=>Object.assign(x.r,{item:x.i}));
  let qi=state.records.findIndex(r=>!r.done);
  if(qi<0)return false;
  state.records[qi]=newRec(state.queue[qi]); /* 未做完嗰個詞語由頭開始 */
  state.qi=qi;hist=[];state.flash=null;state.copyText=null;state.warnUnchecked=null;state.view='session';
  enterItem();go();
  return true;
}

  const p=state.resume,ids=p.queue,recs=p.records;

  const when=`${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;

const HAN=/^[\u3400-\u9fff\uf900-\ufaff]+$/;
function validateCustom(c){
  if(!HAN.test(c.word)||c.word.length>6)return'詞語要係 1 至 6 個中文字。';
  if(ITEMS.some(it=>it.word===c.word&&it.id!==c.id))return`「${c.word}」已經喺訓練詞語入面。`;
  const jt=c.jyut?c.jyut.split(' '):[];
  if(jt.length!==c.word.length||!jt.every(t=>/^[a-z]+[1-6]$/.test(t)))return`粵拼要每個字一個音節、帶聲調數字（「${c.word}」有 ${c.word.length} 個字）。`;
  let open=0;
  for(const F of FEATS){const f=c.feats[F.key];if(f.na)continue;open++;
    if(!f.a)return`「${F.label}」未有正確答案；如果唔適用，請剔「不適用」。`;
    if(f.d.filter(x=>x!==f.a).length<3)return`「${F.label}」要有至少 3 個同答案唔同嘅干擾選項。`;}
  if(!open)return'六個特徵最少要有一個適用。';
  if(!HAN.test(c.verb)||c.verb.length>3)return'延伸練習要有搭配動詞（1 至 3 個中文字）。';
  const vt=c.verbJ?c.verbJ.split(' '):[];
  if(vt.length!==c.verb.length||!vt.every(t=>/^[a-z]+[1-6]$/.test(t)))return'動詞粵拼要每個字一個音節、帶聲調數字。';
  return null;
}
function loadPhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();

    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.8));};
  im.onerror=()=>{URL.revokeObjectURL(url);rej();};im.src=url;});}

/* ---------- 計時 ---------- */
let T=null;
function timerKind(){
  if(state.view!=='session'||state.phase==='done')return null;
  if(state.phase==='feat')return state.sub==='oral'?'oral':state.sub==='options'?'opt':null;
  return'oral';
}
function stopTimer(){if(T){clearInterval(T.iv);T=null;}}
function armTimer(){
  stopTimer();if(!S.autoTimer)return;const k=timerKind();if(!k)return;
  const total=(k==='oral'?S.oralWait:S.optWait)*1000;
  T={total,remain:total,paused:state.drawer,kind:k,last:performance.now()};
  T.iv=setInterval(tick,100);
}
function tick(){
  if(!T)return;const now=performance.now();
  if(T.paused||T.hold||T.typing){T.last=now;return;}
  T.remain-=now-T.last;T.last=now;
  if(T.remain<=0){const k=T.kind;stopTimer();if(k==='oral')A.judge({r:'none'});else A.optTimeout();return;}
  paintTimer();
}
function paintTimer(){
  const sec=document.getElementById('tSec'),bar=document.getElementById('tBar'),pb=document.getElementById('pBar'),bp=document.getElementById('btnPause');
  if(!T){return;}
  const pct=Math.max(0,T.remain/T.total*100)+'%';
  if(sec)sec.textContent=Math.ceil(T.remain/1000);
  if(bar)bar.style.width=pct;if(pb)pb.style.width=pct;
  if(bp)bp.textContent=T.paused?'繼續計時':'暫停計時';
  const lab=document.getElementById('tLab');if(lab)lab.textContent=T.hold?(state.sub==='oral'?'讀題中':'朗讀中'):T.kind==='oral'?'口語等待':'選項等待';
}

const V={webOK:false,web:null,player:null,cancel:null,lastU:null};
try{V.webOK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);}catch(e){}
function pickVoice(){
  const vs=speechSynthesis.getVoices()||[];
  const yue=v=>/^(?:yue|zh[-_]HK)(?:[-_]|$)/i.test(v.lang||'')||/cantonese|粵|廣東/i.test(v.name||'');
  return vs.find(v=>yue(v)&&v.localService)||vs.find(yue)||null;
}
function refreshVoices(){
  try{V.web=pickVoice();}catch(e){V.web=null;}
  if(state.drawer)renderDrawer();
  if(state.view==='session')render();
}
function engine(text=speakText()){
  if(!S.voiceOn||!text)return null;
  if(S.voiceEngine==='device'&&V.web)return 'device';
  if(Object.hasOwn(QUESTION_AUDIO,text))return 'recording';
  return V.web?'device':null;
}
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function voiceStatus(short){
  if(!S.voiceOn)return short?'已關閉':'已關閉（右上角語音開關）';
  if(!S.speak&&!S.speakModel)return'已關閉';
  if(S.voiceEngine==='device'&&V.web)return short?'裝置語音':'裝置語音（'+escH(V.web.name)+'）';
  return short?'香港粵語題目語音':'香港粵語題目語音（網站內置）';
}
function stopSpeak(){
  const cancel=V.cancel;
  V.cancel=null;
  if(cancel)cancel();
}
function speakNow(text,done){
  const kind=engine(text);
  stopSpeak();
  if(!kind){if(done)done();return false;}

  let clearPlayback=()=>{};
  const cancel=()=>{clearTimeout(guard);clearPlayback();};
  const finish=()=>{
    if(V.cancel!==cancel)return;
    stopSpeak();
    if(done)done();
  };
  const guard=setTimeout(finish,9000);
  V.cancel=cancel;

  function playDevice(){
    if(!V.web){finish();return;}
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=V.web.lang;u.voice=V.web;u.rate=S.speakRate;
      u.onend=finish;u.onerror=finish;
      V.lastU=u;
      clearPlayback=()=>{
        u.onend=null;u.onerror=null;V.lastU=null;
        speechSynthesis.cancel();
      };
      speechSynthesis.speak(u);
    }catch(e){finish();}
  }

  if(kind==='device'){playDevice();return true;}
  let audio;
  const fallback=()=>{
    if(V.cancel!==cancel||clearPlayback!==clearAudio)return;
    clearAudio();
    clearPlayback=()=>{};
    playDevice();
  };
  const clearAudio=()=>{
    if(!audio)return;
    audio.onended=null;audio.onerror=null;audio.pause();
  };
  clearPlayback=clearAudio;
  try{
    audio=V.player||(V.player=new Audio());
    audio.onended=finish;audio.onerror=fallback;
    audio.src='data:audio/mpeg;base64,'+QUESTION_AUDIO[text];
    audio.playbackRate=S.speakRate;
    const started=audio.play();
    if(started)started.catch(fallback);
  }catch(e){fallback();}
  return true;
}
/* 首音節提示：多音節詞讀第一個字；單音節詞嘅「第一個字」即係成個詞，預設唔讀 */
function cueSpeech(it){return(it.word.length>1||S.monoCue==='word')?it.syl:null;}
function speakText(){
  if(state.view!=='session')return null;
  const ph=state.phase,sub=state.sub;
  if(ph==='feat'&&sub==='options')return S.speak?'揀一個啱嘅答案。':null;
  if(sub!=='oral'){
    if(!S.speakModel)return null;
    const it=item();
    if(ph==='feat'&&(sub==='model'||sub==='confirm'||sub==='reveal'))return it.feats[FEATS[state.fi].key].a;
    if(ph==='name2'&&sub==='cue')return cueSpeech(it);
    if(ph==='name2'&&sub==='model')return it.word;
    if(ph==='ext'&&sub==='model')return it.ext[state.level].parts.join('');
    return null;
  }
  if(!S.speak)return null;
  if(ph==='name1')return'呢個係乜嘢？';
  if(ph==='feat')return FEATS[state.fi].q;
  if(ph==='name2')return'再講一次，呢個係乜嘢？';
  if(ph==='ext')return['睇住圖同字，再講一次。','兩個詞一齊講。','講一句完整嘅句子。'][state.level];
  return null;
}
/* read the question aloud; the response timer starts only after reading ends */
const stepKey=()=>[state.view,state.qi,state.phase,state.fi,state.sub,state.level].join('|');
function announce(){
  const t=speakText();
  if(!t||!engine()){stopSpeak();return;}
  const myT=T;if(myT)myT.hold=true;paintTimer();
  const key=stepKey();
  speakNow(t,()=>{
    if(myT&&T===myT){myT.hold=false;myT.last=performance.now();paintTimer();}
    /* 揀啱選項：讀完答案，停一停，自動去下一項特徵 */
    if(state.sub==='confirm'&&stepKey()===key)setTimeout(()=>{if(state.sub==='confirm'&&stepKey()===key)advanceConfirm();},800);
  });
}
function advanceConfirm(){
  if(state.phase!=='feat'||state.sub!=='confirm')return;
  const a=item().feats[FEATS[state.fi].key].a;
  flash('good','啱喇：'+a);enterFeat(state.fi+1);go();
}
if(V.webOK){
  try{V.web=pickVoice();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',refreshVoices);else speechSynthesis.onvoiceschanged=refreshVoices;}catch(e){}
}

/* ---------- 答題音效（用 Web Audio 即時合成，唔使下載檔案） ---------- */
let AC=null;
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
function audioCtx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();}catch(e){return null;}}
  try{if(AC.state==='suspended')AC.resume();}catch(e){}
  return AC;
}
document.addEventListener('click',()=>{if(S.voiceOn&&S.sfx)audioCtx();},true);
/* 啱：兩粒上升嘅清脆音；錯：兩粒柔和下降音（唔用刺耳蜂鳴聲，避免令患者受挫） */
function playSfx(kind){
  try{(window.__sfxLog||(window.__sfxLog=[])).push(kind);}catch(e){}
  if(!S.voiceOn||!S.sfx)return 0;
  const ac=audioCtx();if(!ac)return 0;
  const notes=kind==='good'?[[659.25,0,.16],[987.77,.13,.4]]:[[392,0,.22],[293.66,.2,.42]];
  try{
    const t0=ac.currentTime+.02;
    notes.forEach(([f,st,du])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=kind==='good'?'sine':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.3,t0+st+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);
      o.connect(g);g.connect(ac.destination);o.start(t0+st);o.stop(t0+st+du+.05);
    });
  }catch(e){return 0;}
  return 650;
}

/* ---------- 選擇題揭曉：留喺三個選項畫面，正確答案整格變綠，讀出答案，等患者自己撳「下一題」 ---------- */
let revealSeq=0;
function startReveal(kind){
  const my=++revealSeq;
  stopSpeak();
  state.sub='reveal';state.revealStage=kind==='wrong'?'wrong':'shown';
  stopTimer();render();
  const key=stepKey();
  const ms=kind==='correct'?playSfx('good'):kind==='wrong'?playSfx('bad'):0;
  const live=()=>my===revealSeq&&stepKey()===key;
  const show=()=>{if(!live()||state.revealStage==='ready')return;state.revealStage='shown';render();sayAnswer(key);};
  if(kind==='wrong')setTimeout(show,Math.max(ms,500)+250);
  else if(ms)setTimeout(()=>{if(live())sayAnswer(key);},ms);
  else sayAnswer(key);
}
function sayAnswer(key){
  const ready=()=>{if(stepKey()!==key||state.sub!=='reveal')return;state.revealStage='ready';render();};
  const t=speakText();
  if(!t||!engine()){ready();return;}
  speakNow(t,ready);
}

/* ---------- 流程 ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function enterItem(){state.phase='name1';state.sub='oral';state.fi=0;state.level=0;}
function enterFeat(i){
  const it=item(),r=rec();
  while(i<FEATS.length&&(it.feats[FEATS[i].key].na||r.feats[i].na)){r.feats[i].na=true;i++;}
  if(i>=FEATS.length){enterName2();return;}
  state.phase='feat';state.fi=i;state.sub='oral';
}
function enterName2(){
  if(!S.name2On){rec().name2Off=true;enterExt(0);return;} /* 治療師未開放「再次命名」 */
  state.phase='name2';state.sub='oral';
}
function enterExt(l){if(l>S.maxLevel){rec().extMax=S.maxLevel;finishItem();return;}state.phase='ext';state.level=l;state.sub='oral';}
function finishItem(){state.phase='done';const R=rec();R.done=true;if(R.extMax==null)R.extMax=S.maxLevel;saveProgress(); /* 每完成一個詞語自動儲存 */}
function go(){armTimer();render();announce();}

const A={
  toggleItem(d){const i=+d.i;state.selected[i]=!state.selected[i];render();},
  start(d){
    state.queue=ITEMS.map((_,i)=>i).filter(i=>state.selected[i]);if(!state.queue.length)return;
    const unchecked=state.queue.map(i=>ITEMS[i]).filter(it=>it.custom&&!it.checked).map(it=>it.word);
    if(unchecked.length&&!(d&&d.force)){state.warnUnchecked=unchecked;render();return;}
    state.warnUnchecked=null;
    state.records=state.queue.map(newRec);state.qi=0;hist=[];state.flash=null;state.view='session';state.copyText=null;enterItem();go();
  },
  judge(d){
    if(state.view!=='session')return;
    const r=d.r,R=rec(),it=item(),ph=state.phase,sub=state.sub;
    if(ph==='done'||(ph==='feat'&&sub!=='oral'))return;
    snap();state.flash=null;
    if(d.typed){const k=typedKey();if(k){(R.typed||(R.typed={}))[k]=d.typed;}}
    if(ph==='name1'){
      R.name1=r;
      if(r==='correct'&&S.afterCorrect==='skip'){flash('good',`啱喇，係「${it.word}」。而家用佢嚟講多啲。`);enterExt(0);}
      else{if(r==='correct')flash('good',`啱喇，係「${it.word}」。我哋再諗下佢嘅特徵。`);else flash('info','唔緊要，我哋一齊諗下佢嘅特徵。');enterFeat(0);}
    }else if(ph==='feat'){
      const f=R.feats[state.fi],fd=it.feats[FEATS[state.fi].key];f.oral=r;
      if(r==='correct'&&S.optMode!=='always'){flash('good','啱喇：'+fd.a);enterFeat(state.fi+1);}
      else{f.opts=shuffle([fd.a].concat(fd.d.slice(0,S.optCount-1)));state.sub='options';if(r==='correct')flash('good','講得啱。喺下面揀返個答案。');}
    }else if(ph==='name2'){
      R.name2.attempts.push({stage:sub,r,rev:false});
      if(r==='correct'){flash('good',`啱喇，係「${it.word}」。`);enterExt(0);}
      else if(sub==='oral')state.sub='cue';
      else if(sub==='cue')state.sub='model';
      else if(r==='pending')enterExt(0);
      else{R.extSkipped=true;flash('info','今次未講到，唔緊要。呢個詞語下次再練。');finishItem();}
    }else if(ph==='ext'){
      const e=R.ext[state.level];
      if(sub==='oral'){e.oral=r;if(r==='correct'){flash('good','講得好。');enterExt(state.level+1);}else if(r==='pending')enterExt(state.level+1);else state.sub='model';}
      else{e.rep=r;if(r==='correct'){flash('good','講得好。');enterExt(state.level+1);}else if(r==='pending')enterExt(state.level+1);else{flash('info','今次練到呢度。');finishItem();}}
    }
    go();
  },
  pick(d){
    if(state.phase!=='feat'||state.sub!=='options')return;
    const R=rec(),f=R.feats[state.fi],fd=item().feats[FEATS[state.fi].key];
    snap();state.flash=null;f.picked=d.v;
    if(d.v===fd.a){f.option='correct';startReveal('correct');}
    else{f.option='incorrect';startReveal('wrong');}
  },
  optTimeout(){if(state.phase!=='feat'||state.sub!=='options')return;snap();state.flash=null;const f=rec().feats[state.fi];f.option='timeout';f.picked=null;startReveal('timeout');},
  next(){
    if(state.phase==='feat'&&(state.sub==='model'||state.sub==='reveal')){snap();state.flash=null;stopSpeak();enterFeat(state.fi+1);go();}
    else if(state.phase==='feat'&&state.sub==='confirm')advanceConfirm();
    else if(state.phase==='done')A.nextItem();
  },
  na(){if(state.phase!=='feat')return;snap();const f=rec().feats[state.fi];f.na=true;flash('info','呢一項唔適用，跳過。');enterFeat(state.fi+1);go();},
  undo(){if(!hist.length)return;const s=JSON.parse(hist.pop());Object.assign(state,s);go();},
  pause(){if(T){T.paused=!T.paused;paintTimer();}},
  voiceToggle(){
    S.voiceOn=!S.voiceOn;saveS();
    if(!S.voiceOn){
      stopSpeak();if(T&&T.hold){T.hold=false;T.last=performance.now();}
      if(state.view==='session'&&state.phase==='feat'&&state.sub==='confirm'){advanceConfirm();return;}
      if(state.view==='session'&&state.sub==='reveal')state.revealStage='ready';
      render();
    }else{render();if(state.view==='session'&&state.sub!=='reveal'&&speakText())announce();}
    if(state.drawer)renderDrawer();
  },
  nextItem(){
    if(state.qi+1<state.queue.length){snap();state.qi++;state.flash=null;enterItem();go();}
    else{stopTimer();stopSpeak();saveProgress();state.view='summary';render();}
  },
  end(){stopTimer();stopSpeak();saveProgress();state.view='summary';render();},
  resume(){state.view='session';go();},
  home(){stopTimer();stopSpeak();state.view='home';render();},
  replay(){if(!speakText())return;armTimer();render();announce();},
  testVoice(){
    const timer=T;
    speakNow('呢個係乜嘢？',()=>{
      if(timer&&T===timer&&timer.hold){timer.hold=false;timer.last=performance.now();paintTimer();}
      if(state.sub==='reveal'&&state.revealStage==='shown'){state.revealStage='ready';render();}
    });
  },
  review(d){
    const R=state.records[+d.ri],v=d.v,i=+d.i;
    if(d.w==='name1'){R.name1=v;R.name1Rev=true;}
    else if(d.w==='feat'){R.feats[i].oral=v;R.feats[i].rev=true;}
    else if(d.w==='name2'){R.name2.attempts[i].r=v;R.name2.attempts[i].rev=true;}
    else if(d.w==='extO'){R.ext[i].oral=v;R.ext[i].rev=true;}
    else if(d.w==='extR'){R.ext[i].rep=v;R.ext[i].rev=true;}
    render();if(state.pendOpen)renderPend();
  },
  addWord(){
    const el=document.getElementById('newWord');if(!el)return;
    const w=cleanTxt(el.value).replace(/\s+/g,'');
    const msg=(t)=>{state.addMsg={type:'err',text:t};render();const n=document.getElementById('newWord');if(n)try{n.focus({preventScroll:true});}catch(e){}};
    if(!w)return msg('請先輸入一個名詞。');
    if(!HAN.test(w)||w.length>6)return msg('請輸入 1 至 6 個中文字嘅名詞。');
    if(ITEMS.some(it=>it.word===w))return msg(`「${w}」已經喺訓練詞語入面。`);
    el.value='';state.addMsg=null;
    openNewEditor(w);render();
  },
  openEditor(d){const c=CUSTOM.find(x=>x.id===d.id);if(!c)return;state.ed={mode:'edit',c:JSON.parse(JSON.stringify(c)),err:null,delArm:false};renderEditor();},
  closeEditor(){state.ed=null;renderEditor();},
  edUseSvg(){collectEditor();state.ed.c.img='';renderEditor();},
  saveEditor(){
    collectEditor();const c=state.ed.c,err=validateCustom(c);
    if(err){state.ed.err=err;renderEditor();const r=document.querySelector('#editRoot .drawer');if(r)r.scrollTop=0;return;}
    c.checked=true;
    if(state.ed.mode==='new'){
      c.id=newId();CUSTOM.push(c);
      if(!saveCustom()){CUSTOM.pop();state.ed.err='裝置儲存空間不足，未能儲存。請改用較細嘅相片。';renderEditor();return;}
      ITEMS.push(customToItem(c));state.selected.push(true);state.addMsg={type:'ok',text:`已新增「${c.word}」並加入訓練。`};
    }else{
      const k=CUSTOM.findIndex(x=>x.id===c.id),prev=CUSTOM[k];CUSTOM[k]=c;
      if(!saveCustom()){CUSTOM[k]=prev;state.ed.err='裝置儲存空間不足，未能儲存。請改用較細嘅相片。';renderEditor();return;}
      ITEMS[ITEMS.findIndex(it=>it.id===c.id)]=customToItem(c);state.addMsg={type:'ok',text:`已儲存「${c.word}」，標記為已核對。`};
    }
    state.ed=null;state.warnUnchecked=null;renderEditor();render();
  },
  deleteCustom(){
    if(!state.ed.delArm){collectEditor();state.ed.delArm=true;renderEditor();return;}
    const id=state.ed.c.id,k=CUSTOM.findIndex(x=>x.id===id);
    if(k>=0){
      const [previous]=CUSTOM.splice(k,1);
      if(!saveCustom()){
        CUSTOM.splice(k,0,previous);
        state.ed.err='未能更新呢部裝置嘅詞語記錄。';renderEditor();return;
      }
    }
    const ii=ITEMS.findIndex(it=>it.id===id);
    if(ii>=0){const w=ITEMS[ii].word;ITEMS.splice(ii,1);state.selected.splice(ii,1);state.addMsg={type:'ok',text:`已刪除「${w}」。`};}
    state.ed=null;state.warnUnchecked=null;renderEditor();render();
  },
  saveWords(){
    const ok=saveCustom(),el=document.getElementById('wordSaveStat');
    if(el){el.textContent=ok?'已暫存喺呢部裝置':'未能儲存喺呢部裝置';el.classList.toggle('err',!ok);}
  },
  async saveProg(){
    const b=document.getElementById('btnSaveProg');if(b){b.disabled=true;b.textContent='儲存緊…';}
    const r=await saveProgress();
    const b2=document.getElementById('btnSaveProg');
    if(b2){b2.textContent=r==='cleared'?'✓ 已儲存':r==='local'?'✓ 已暫存':r==='error'?'未能儲存':'冇進度可儲存';b2.disabled=false;
      setTimeout(()=>{const b3=document.getElementById('btnSaveProg');if(b3)b3.textContent='儲存進度';},2500);}
  },
  resumeContinue(){const p=state.resume;state.resume=null;if(!p||!restoreProgress(p)){state.view='home';render();}},
  resumeRestart(){state.resume=null;state.records=[];state.queue=[];clearProgress();state.view='home';render();},
  openPending(){state.pendOpen=true;if(T)T.paused=true;renderPend();paintTimer();},
  closePending(){state.pendOpen=false;if(T&&!state.drawer)T.paused=false;renderPend();render();},
  typeSubmit(){
    const el=document.getElementById('typeAns');if(!el)return;
    const text=el.value.trim();
    if(!text){el.focus();return;}
    if(T)T.typing=false;
    A.judge({r:typedVerdict(text),typed:text});
  },
  copy(){
    const t=summaryText();state.copyText=t;
    try{navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('btnCopy');if(b)b.textContent='已複製';}).catch(()=>{});}catch(e){}
    render();
  },
  openSettings(){state.drawer=true;if(T)T.paused=true;renderDrawer();paintTimer();},
  closeSettings(){state.drawer=false;panelLock=0;judgeLock=0;if(T)T.paused=false;if(state.sub==='reveal'&&state.revealStage==='shown'&&!V.cancel)state.revealStage='ready';renderDrawer();render();},
  set(d){const m=measureDrawer();let v=d.v;if(v==='true')v=true;else if(v==='false')v=false;else if(!isNaN(+v))v=+v;S[d.k]=v;saveS();applyScale();renderDrawer(m);},
  toggle(d){S[d.k]=!S[d.k];saveS();renderDrawer();},
  step(d){const k=d.k,v=Math.min(60,Math.max(5,S[k]+(+d.d)));S[k]=v;saveS();renderDrawer();},
  resetSettings(){const m=measureDrawer();S=Object.assign({},DEFAULTS,{voiceOn:S.voiceOn});saveS();applyScale();renderDrawer(m);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  lastTapId=el.id||null;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  const fn=A[el.dataset.act];if(fn)fn(el.dataset);
});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='typeForm'){e.preventDefault();A.typeSubmit();}if(e.target&&e.target.id==='addForm'){e.preventDefault();A.addWord();}});
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.id||!state.ed)return;
  if(t.id==='ed-file'&&t.files&&t.files[0]){collectEditor();loadPhoto(t.files[0]).then(u=>{if(!state.ed)return;state.ed.c.img=u;state.ed.err=null;renderEditor();}).catch(()=>{if(!state.ed)return;state.ed.err='讀唔到呢個圖片檔，請揀另一張相。';renderEditor();});}
  if(t.id.startsWith('ed-na-')){const k=t.id.slice(6);['ed-a-','ed-d-'].forEach(p=>{const x=document.getElementById(p+k);if(x)x.disabled=t.checked;});}
});
/* 患者開始打字就暫停倒數，避免打到一半被當成「無反應」；清空並離開輸入框先繼續 */
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='typeAns'&&T)T.typing=true;});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='typeAns'&&T)T.typing=true;});
document.addEventListener('focusout',e=>{if(e.target&&e.target.id==='typeAns'&&T&&!e.target.value.trim())T.typing=false;});

/* 打字答案嘅灰色例子：刻意用同訓練詞語無關嘅字，避免提示答案 */
const TYPE_EX={name:['電話','鉸剪','時鐘'],cat:['動物','文具','電器'],use:['用嚟睇時間','用嚟剪嘢','用嚟寫字'],act:['用手按','用手剪','坐上去'],prop:['方形、黑色','長長、尖尖','細細粒、白色'],loc:['客廳','學校','銀行'],assoc:['生日','新年','考試'],ext:[['電話','鉸剪','時鐘'],['打電話','用鉸剪','睇時鐘'],['我打電話','我用鉸剪','我睇時鐘']]};
/* 揀一個同目前詞語、答案都唔重疊嘅例子（自訂詞語可能就係「電話」） */
function typeExample(){
  const ph=state.phase,it=item();
  const list=ph==='feat'?TYPE_EX[FEATS[state.fi].key]:ph==='ext'?TYPE_EX.ext[state.level]:TYPE_EX.name;
  const bad=[it.word,...(it.alt?it.alt.split('、'):[]),...typedTargets()].map(normAns).filter(Boolean);
  const pick=list.find(x=>{const n=normAns(x);return !bad.some(b=>n.includes(b)||b.includes(n));})||list[0];
  return '例如：'+pick;
}
const normAns=t=>String(t||'').normalize('NFKC').replace(/[\s、，,。．.！!？?「」『』（）()：:；;·・\-—~～]/g,'').toLowerCase();
function typedTargets(){
  const it=item(),ph=state.phase;
  if(ph==='name1'||ph==='name2')return [it.word].concat(it.alt?it.alt.split('、'):[]);
  if(ph==='feat')return [it.feats[FEATS[state.fi].key].a];
  if(ph==='ext')return [it.ext[state.level].parts.join('')];
  return [];
}
/* 打字答案同目標（或可接受答案）完全一樣就記「正確」；其他一律交「待覆核」，由治療師決定，唔會自動當錯 */
function typedVerdict(text){const n=normAns(text);return typedTargets().some(t=>normAns(t)===n)?'correct':'pending';}
function typedKey(){
  const ph=state.phase,R=rec();
  if(ph==='name1')return'name1:0';
  if(ph==='feat')return'feat:'+state.fi;
  if(ph==='name2')return'name2:'+R.name2.attempts.length;
  if(ph==='ext')return(state.sub==='model'?'extR:':'extO:')+state.level;
  return null;
}
function judgeBar(){

    if(ph==='name2'&&sub==='model'){note=said?'系統會讀出整個詞語，然後判讀患者跟讀。':'請口頭示範整個詞語，然後判讀患者跟讀。';btns=four('跟讀成功','跟讀不成功');}

    else if(sub==='options'){btns=`<div class="jbtns"><button class="jb w" id="jReveal" data-act="optTimeout" style="grid-column:span 2">直接顯示答案</button></div>`;note='等候患者揀選文字選項。';}
    else{btns=`<div class="jbtns"><button class="jb w" id="jNext" data-act="next" style="grid-column:span 2">下一項</button></div>`;note=speakText()&&engine()?'系統會讀出答案，讓患者跟讀。':'請示範答案，讓患者跟讀。';}

const ICON_LOCK_S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function stepsHTML(si){
  return STAGES.map((s,i)=>{
    const off=(i===2&&!S.name2On)||(i===3&&S.maxLevel<0);
    const on=i===si&&!off;
    let sx='';
    if(off)sx=`<span class="sx">${ICON_LOCK_S}未開放</span>`;
    else if(i===3&&S.maxLevel<2)sx=`<span class="sx">${LEVELS.slice(0,S.maxLevel+1).map((l,k)=>`<span class="lv${state.phase==='ext'&&state.level===k?' cur':''}">${l}</span>`).join('·')}</span>`;
    else if(i===3)sx=`<span class="sx">${LEVELS.map((l,k)=>`<span class="lv${state.phase==='ext'&&state.level===k?' cur':''}">${l}</span>`).join('·')}</span>`;
    const cls=off?'off':on?'on':i<si?'past':'';
    const lab=(on?'▶ ':i<si&&!off?'✓ ':'')+s;
    return `<li id="step-${i}" class="${cls}"${on?' aria-current="step"':''}${off?' aria-label="'+s+'，未開放"':''}><span class="sn">${lab}</span>${sx}</li>`;
  }).join('');
}

function summaryStats(){
  const rs=state.records;let n1=0,n1t=0,n2=0,n2t=0,fo=0,ft=0;
  rs.forEach(r=>{if(r.name1){n1t++;if(r.name1==='correct')n1++;}
    const nf=nameFinal(r.name2);if(nf!=='todo'&&nf!=='prog'){n2t++;if(nf==='ind'||nf==='cue')n2++;}
    r.feats.forEach(f=>{const s=featStatus(f);if(s!=='na'&&s!=='todo'){ft++;if(s==='oral')fo++;}});});
  return{n1,n1t,n2,n2t,fo,ft,pend:pendings().length,done:rs.filter(r=>r.done).length,total:rs.length};
}
function summaryText(){
  const st=summaryStats();
  const lines=['粵語 SFA 訓練原型 · 課節摘要（示例資料，非真實患者）',`完成詞語 ${st.done}/${st.total}；初次命名正確 ${st.n1}/${st.n1t}；再次命名成功（獨立或首音提示後）${st.n2}/${st.n2t}；特徵口語正確 ${st.fo}/${st.ft}；待覆核 ${st.pend} 項`,''];
  state.records.forEach(r=>{const it=ITEMS[r.item];
    lines.push(`【${it.word}】初次命名：${r.name1?RLAB[r.name1][1]:'未做'}；`+r.feats.map((f,i)=>FEATS[i].label+'：'+FPILL[featStatus(f)][1]).join('、')+`；再次命名：${n2txt(r)}；`+LEVELS.map((l,i)=>l+'：'+extxt(r,i)).join('、'));});
  return lines.join('\n');
}
function renderSummary(){
  const st=summaryStats(),pd=pendings(),unfinished=st.done<st.total;
  const rows=state.records.map(r=>{const it=ITEMS[r.item];
    return `<tr><td><span class="w">${it.word}</span></td><td>${r.name1?pp(RLAB[r.name1]):pill('todo','未做')}</td>${r.feats.map(f=>`<td>${pp(FPILL[featStatus(f)])}</td>`).join('')}<td>${n2cell(r)}</td>${r.ext.map((e,i)=>`<td>${excell(r,i)}</td>`).join('')}</tr>`;}).join('');
  return `<div class="wrap"><div class="sum" id="summary">
  <header><p class="eyebrow">原型測試版 · 示例資料</p><h1>課節摘要</h1></header>
  <div class="tiles"><div class="tile"><div class="n">${st.done}／${st.total}</div><div class="l">完成詞語</div></div><div class="tile"><div class="n">${st.n1}／${st.n1t}</div><div class="l">初次命名正確</div></div><div class="tile"><div class="n">${st.n2}／${st.n2t}</div><div class="l">再次命名成功（獨立或首音提示後）</div></div><div class="tile"><div class="n">${st.fo}／${st.ft}</div><div class="l">特徵口語正確（不計「不適用」）</div></div><div class="tile pend"><div class="n" id="pendTile">${st.pend}</div><div class="l">待覆核</div></div></div>
  <section><h2 class="sec-h">待覆核項目 <small>判讀不確定嘅口語回答，由治療師確認後先計分</small></h2>
  <div class="review" id="reviewList">${pd.length?pd.map((p,n)=>`<div class="rv"><div class="t"><b>${p.word}</b> · ${p.label}<small>目標：${p.target}</small>${p.typed?`<span class="typed">患者打字：${escH(p.typed)}</span>`:''}</div><button class="btn sm" id="rvC${n}" data-act="review" data-ri="${p.ri}" data-w="${p.w}" data-i="${p.i}" data-v="correct">覆核為正確</button><button class="btn sm" id="rvX${n}" data-act="review" data-ri="${p.ri}" data-w="${p.w}" data-i="${p.i}" data-v="incorrect">覆核為不正確</button></div>`).join(''):'<p class="hint">冇待覆核項目。</p>'}</div></section>
  <section><h2 class="sec-h">逐詞記錄</h2><div class="tablewrap"><table><thead><tr><th>詞語</th><th>初次命名</th>${FEATS.map(f=>`<th>${f.label}</th>`).join('')}<th>再次命名</th>${LEVELS.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="legend" style="margin-top:10px">${pill('good','口語正確')}自發講出 ${pill('cue','選項正確')}口語未答對，文字選項揀啱 ${pill('bad','示範')}需要示範答案 ${pill('na','不適用')}該特徵對此詞語不適用 ${pill('pend','待覆核')}判讀不確定</p></section>
  <div class="home-actions">${unfinished?'<button class="btn primary" id="btnResume" data-act="resume">返回繼續訓練</button>':''}<button class="btn" id="btnCopy" data-act="copy">複製文字摘要</button><button class="btn" id="btnHome" data-act="home">返回主頁</button></div>
  ${state.copyText?`<textarea class="copy" id="copyText" readonly aria-label="文字摘要">${state.copyText}</textarea>`:''}
  </div></div>`;
}

let lastView=null,lastStep=null,lastTapId=null,panelLock=0,judgeLock=0;
function render(){
  const app=document.getElementById('app');
  const y=window.scrollY;
  const tIn=document.getElementById('typeAns'),tVal=tIn?tIn.value:'',tFoc=!!tIn&&document.activeElement===tIn,tStep=stepKey();
  const wIn=document.getElementById('newWord'),wVal=wIn?wIn.value:'',wFoc=!!wIn&&document.activeElement===wIn;
  app.innerHTML=state.view==='home'?renderHome():state.view==='session'?renderSession():state.view==='resume'?renderResume():renderSummary();
  paintTimer();
  {const n=document.getElementById('newWord');if(n&&(wVal||wFoc)){n.value=wVal;if(wFoc)try{n.focus({preventScroll:true});}catch(e){}}}
  if(tVal&&stepKey()===tStep){const n=document.getElementById('typeAns');if(n){n.value=tVal;if(tFoc)try{n.focus({preventScroll:true});}catch(e){}}}
  /* 只有轉畫面或者轉步驟先郁位置；改設定、勾選、覆核都保持原位 */
  /* 只有轉詞語、轉畫面版面（看圖／特徵圖／完成）先重新定位；同一版面內撳判讀掣，畫面保持原位 */
  const lay=state.view==='session'?state.qi+'|'+(state.phase==='done'?'done':(state.phase==='feat'||state.phase==='name2')?'chart':'duo'):'';
  const newView=state.view!==lastView,newLay=lay!==lastStep;
  lastView=state.view;lastStep=lay;
  /* 同一版面內，問題框只會變高唔會變矮，避免頁面縮短時瀏覽器被迫捲動 */
  if(newView||newLay){panelLock=0;judgeLock=0;}
  const pnEl=document.getElementById('panel');
  if(pnEl){panelLock=Math.max(panelLock,pnEl.getBoundingClientRect().height);pnEl.style.minHeight=panelLock+'px';}
  /* 底部治療師欄同樣只會變高唔會變矮（大字體時按鈕字會換行），避免頁面長度改變令畫面移位 */
  const jEl=document.getElementById('judge');
  if(jEl){judgeLock=Math.max(judgeLock,jEl.getBoundingClientRect().height);jEl.style.minHeight=judgeLock+'px';}
  if(newView||newLay){window.scrollTo(0,0);}
  else{if(window.scrollY!==y)window.scrollTo(0,y);return;}
  /* keep the patient's task clear of the docked judging bar */
  const pn=document.getElementById('panel'),jb=document.getElementById('judge');
  if(pn&&jb){const over=pn.getBoundingClientRect().bottom+12-jb.getBoundingClientRect().top;if(over>0)window.scrollBy(0,over);}
}

/* 記住設定面板嘅捲動位置、焦點，同埋啱啱撳過嘅掣喺畫面嘅位置（iPad 撳掣唔會有焦點，所以以撳過嘅掣做定位點） */
function measureDrawer(){
  const old=document.querySelector('#drawerRoot .drawer');
  if(!old)return{keepTop:0,keepFocus:null,anchorId:null,anchorOff:null};
  const ae=document.activeElement,keepFocus=ae&&old.contains(ae)?ae.id:null;
  const anchorId=lastTapId&&old.querySelector('#'+CSS.escape(lastTapId))?lastTapId:keepFocus;
  const anchorEl=anchorId?old.querySelector('#'+CSS.escape(anchorId)):null;
  return{keepTop:old.scrollTop,keepFocus,anchorId,anchorOff:anchorEl?anchorEl.getBoundingClientRect().top-old.getBoundingClientRect().top:null};
}
function renderPend(){
  const root=document.getElementById('pendRoot');
  if(!state.pendOpen){root.innerHTML='';return;}
  const old=root.querySelector('.drawer'),top=old?old.scrollTop:0;
  const pd=pendings();
  root.innerHTML=`<div class="scrim" data-act="closePending"><div class="drawer" role="dialog" aria-modal="true" aria-label="待覆核項目">
  <div class="dhead"><h2>待覆核項目（${pd.length}）</h2><button class="btn sm" id="btnClosePend" data-act="closePending">關閉</button></div>
  <p class="rd">判讀唔確定、或者打字答案同目標唔完全一樣嘅回答。覆核後先計分；而家唔覆核，課節摘要入面都可以再做。打開呢個清單時會暫停計時。</p>
  <div class="pendlist" id="pendList">${pd.length?pd.map((x,n)=>`<div class="rv"><div class="t"><b>${x.word}</b> · ${x.label}<small>目標：${x.target}</small>${x.typed?`<span class="typed">患者打字：${escH(x.typed)}</span>`:''}</div><div class="acts"><button class="btn sm" id="pdC${n}" data-act="review" data-ri="${x.ri}" data-w="${x.w}" data-i="${x.i}" data-v="correct">覆核為正確</button><button class="btn sm" id="pdX${n}" data-act="review" data-ri="${x.ri}" data-w="${x.w}" data-i="${x.i}" data-v="incorrect">覆核為不正確</button></div></div>`).join(''):'<p class="hint" id="pendEmpty">而家冇待覆核項目。</p>'}</div>
  </div></div>`;
  const nd=root.querySelector('.drawer');if(nd)nd.scrollTop=top;
}
function renderDrawer(pre){
  const root=document.getElementById('drawerRoot');
  if(!state.drawer){root.innerHTML='';return;}
  const {keepTop,keepFocus,anchorId,anchorOff}=pre||measureDrawer();
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(o=>`<button id="set-${k}-${o[0]}" data-act="set" data-k="${k}" data-v="${o[0]}" aria-pressed="${String(S[k])===String(o[0])}">${o[1]}</button>`).join('')}</div>`;
  const stepper=(k,unit)=>`<div class="stepper"><button id="set-${k}-minus" data-act="step" data-k="${k}" data-d="-5" aria-label="減少 5 秒">−</button><output id="set-${k}-val">${S[k]} ${unit}</output><button id="set-${k}-plus" data-act="step" data-k="${k}" data-d="5" aria-label="增加 5 秒">＋</button></div>`;
  const sw=(k,l,d)=>`<div class="row"><div class="sw"><div><div class="rl">${l}</div><div class="rd">${d}</div></div><button class="switch" id="set-${k}" role="switch" aria-checked="${S[k]}" aria-label="${l}" data-act="toggle" data-k="${k}"></button></div></div>`;
  root.innerHTML=`<div class="scrim" data-act="closeSettings"><div class="drawer" role="dialog" aria-modal="true" aria-label="治療師設定">
  <div class="dhead"><h2>治療師設定</h2><button class="btn sm" id="btnCloseSettings" data-act="closeSettings">完成</button></div>
  <div class="row"><div class="rl">口語回答等待時間</div><div class="rd">每次提問後等候口語反應嘅時間（5–60 秒）。時間到會記錄為「無反應」並進入下一層提示。</div>${stepper('oralWait','秒')}</div>
  <div class="row"><div class="rl">文字選項等待時間</div><div class="rd">文字選項出現後等候揀選嘅時間。時間到會顯示答案作示範。</div>${stepper('optWait','秒')}</div>
  ${sw('speak','自動讀出問題','每次出現新問題時自動朗讀；讀完之後先開始計等待時間。')}
  ${sw('speakModel','自動讀出答案、首音節同示範','特徵答錯後讀出答案；再次命名答錯後讀出首個音節，再錯就讀出整個詞語；延伸練習答錯後讀出整個詞語、雙詞或句子。讀完先開始計等待時間。')}
  ${sw('sfx','答題音效','揀選擇題時播放音效：揀啱係清脆上升音，揀錯係柔和下降音。右上角「語音：關」時亦會靜音。')}
  <div class="row"><div class="rl">單音節詞嘅首音節提示</div><div class="rd">例如「杯」「遮」：首個音節即係成個詞，讀出嚟就等於直接示範答案。</div>${seg('monoCue',[['none','唔自動讀（由治療師示範聲母）'],['word','照讀出成個字']])}</div>
  <div class="row"><div class="rl">朗讀語音</div><div class="rd" id="voiceStatus">目前：${voiceStatus(false)}</div><div class="rd">「自動」會用網站內置嘅香港粵語語音讀題。答案同示範會用裝置嘅粵語語音（如有）。</div>${seg('voiceEngine',[['auto','自動'],['device','優先用裝置粵語語音']])}<div class="rl" style="margin-top:6px">朗讀速度</div>${seg('speakRate',[[0.75,'慢'],[0.9,'稍慢'],[1,'正常']])}<div><button class="btn sm" id="btnTestVoice" data-act="testVoice">試聽「呢個係乜嘢？」</button></div></div>
  ${sw('autoTimer','自動計時','關閉後唔會自動記錄「無反應」，全部由治療師手動判讀。')}
  ${sw('showPatientTimer','向患者顯示倒數','預設關閉，避免倒數令患者有壓力；治療師一欄一定會顯示。')}
  <div class="row"><div class="rl">文字選項出現時機</div><div class="rd">文字選項一定喺口語回答（或等待時間完結）之後先出現。</div>${seg('optMode',[['afterFail','口語未答對後先出現'],['always','每次口語回答後都出現']])}</div>
  <div class="row"><div class="rl">文字選項數量</div>${seg('optCount',[[2,'2 個'],[3,'3 個'],[4,'4 個']])}</div>
  <div class="row"><div class="rl">首音提示形式</div><div class="rd">單音節詞一律用聲母提示。</div>${seg('cueForm',[['onset','聲母（例如 p…）'],['syllable','首個音節（例如 蘋…）']])}</div>
  <div class="row"><div class="rl">初次命名正確時</div>${seg('afterCorrect',[['full','仍然做特徵分析'],['skip','直接去延伸練習']])}</div>
  ${sw('name2On','開放「再次命名」','關閉後，特徵分析完會直接去延伸練習；畫面頂嘅階段會標示「未開放」。')}
  <div class="row"><div class="rl">延伸練習開放層次</div><div class="rd">未開放嘅層次會喺畫面頂標示。</div>${seg('maxLevel',[[-1,'未開放'],[0,'單詞'],[1,'單詞＋雙詞'],[2,'單詞＋雙詞＋句子']])}</div>
  ${sw('showJyut','顯示粵拼','喺示範詞語同句子下面顯示粵拼。')}
  <div class="row"><div class="rl">字體大小</div>${seg('scale',[[1,'標準'],[1.15,'大'],[1.3,'特大']])}</div>
  <div><button class="btn" id="btnResetSettings" data-act="resetSettings">還原預設值</button></div>
  <p class="rd">設定只會保存喺呢部裝置嘅瀏覽器；新設定由下一個步驟開始生效。</p>
  </div></div>`;
  const nd=root.querySelector('.drawer');
  if(nd){nd.scrollTop=keepTop;
    if(anchorOff!==null){const na=document.getElementById(anchorId);if(na)nd.scrollTop+=na.getBoundingClientRect().top-nd.getBoundingClientRect().top-anchorOff;}
    if(keepFocus){const el=document.getElementById(keepFocus);if(el)try{el.focus({preventScroll:true});}catch(e){}}}
}

applyScale();initStore();
</script>
